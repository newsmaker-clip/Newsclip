<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Clipping Maker</title>
    <!-- Libraries & Fonts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dhurjati&family=Gidugu&family=Mallanna&family=Mandali&family=NTR&family=Peddana&family=Ponnala&family=Ramabhadra&family=Ramaraja&family=Ravi+Prakash&family=Sree+Krushnadevaraya&family=Suravaram&family=TenaliRamakrishna&family=Timmana&family=Tiro+Telugu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Mandali', sans-serif; background-color: #e9ecef; margin: 0; padding: 0; }
        .app-container { display: flex; height: 100vh; overflow: hidden; }
        .controls-panel { width: 420px; background: #fff; padding: 15px; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .controls-panel h2 { font-size: 20px; color: #111; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-top:0; }
        
        /* Accordion Styles */
        details { background: #f8f9fa; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd; }
        summary { background: #002b80; color: #fff; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 5px; outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 18px; }
        details[open] summary::after { content: '-'; }
        details[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
        .tool-section { padding: 15px; border-top: 1px solid #ccc; }

        .controls-panel label { display: block; font-size: 12px; font-weight: bold; margin-top: 10px; color: #444; }
        .controls-panel input[type="text"], .controls-panel textarea, .controls-panel select, .controls-panel input[type="file"] { width: 100%; padding: 6px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Slider Container & Buttons CSS */
        .range-container { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 5px; }
        .range-container input[type="range"] { flex-grow: 1; margin: 0 !important; }
        .range-btn { background: #002b80; color: #fff; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .range-btn:active { background: #d32f2f; transform: scale(0.95); }

        .flex-row { display: flex; gap: 10px; margin-top: 5px; align-items: center; }
        .flex-row select, .flex-row input[type="text"] { flex-grow: 1; margin-top: 0; }
        .download-btn { width: 100%; background: #28a745; color: #fff; padding: 15px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-bottom: 30px; transition: opacity 0.3s; }
        .action-btn { background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 5px; }
        .save-btn { background: #17a2b8; width: 100%; padding: 10px; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 10px; }
        .load-btn { background: #ffc107; color: #000; width: 100%; padding: 10px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        
        .logo-gallery { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0; margin-top: 5px; }
        .logo-gallery img { height: 40px; cursor: pointer; border: 1px solid #999; border-radius: 3px; }
        .logo-gallery img:hover { border-color: #002b80; opacity: 0.8; }

        .preview-panel { flex-grow: 1; padding: 30px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; background-color: #555; }
        .newspaper-wrapper { background-color: #ffffff; width: 800px; border: 2px solid #000; padding: 10px; box-shadow: 5px 5px 20px rgba(0,0,0,0.5); box-sizing: border-box; transition: width 0.3s; }
        
        .paper-header { text-align: center; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 5px;}
        .paper-header img { max-width: 100%; max-height: 120px; object-fit: contain; }
        
        .overall-wrap-none { padding: 0; background: transparent; border: none; }
        .overall-wrap-active { padding: 15px; border: 1px solid #999; border-radius: 4px; }
        
        /* Updated Wrappers for Dynamic Display */
        #out-sub-wrap { position: relative; top: 0px; display: none; }
        #out-main-wrap { position: relative; top: 0px; display: none; }
        
        .sub-headline { text-align: center; color: #cc0000; font-size: 18px; margin-bottom: 5px; line-height: 1.3;}
        
        /* Main Heading Box Styles */
        .main-headline-box { background-color: #002b80; color: #ffffff; text-align: center; font-size: 36px; line-height: 1.3; padding: 8px 10px; margin: 0 0 10px 0; border: 1px solid #000; }
        .main-headline-text { background-color: transparent; color: #002b80; text-align: center; font-size: 36px; line-height: 1.3; padding: 8px 0; margin: 0 0 10px 0; border: none; }
        
        /* 16 Premium Styles */
        .style-1 { color: #f1c40f; text-shadow: 1px 1px 0 #d35400, 2px 2px 0 #b33900, 3px 3px 0 #802900, 4px 4px 5px rgba(0,0,0,0.8); font-weight: 900; }
        .style-2 { background: #d32f2f; color: #fff; transform: skewX(-12deg); display: inline-block; padding: 5px 25px; box-shadow: 4px 4px 0 #000; }
        .style-3 { color: #e0e0e0; -webkit-text-stroke: 1px #555; text-shadow: -1px -1px 0 #fff, 2px 2px 0 #777, 3px 3px 5px #000; }
        .style-4 { color: transparent; -webkit-text-stroke: 2px #d32f2f; text-shadow: 2px 2px 0 #000; font-weight: bold; }
        .style-5 { color: #d4af37; -webkit-text-stroke: 1px #5c4000; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); border-bottom: 3px double #d4af37; display: inline-block; }
        .style-6 { background: linear-gradient(to bottom, #00c6ff, #0072ff); -webkit-background-clip: text; color: transparent; -webkit-text-stroke: 1px #002b80; text-shadow: 2px 2px 2px rgba(0,0,0,0.3); }
        .style-7 { background: #111; color: #ff3333; padding: 5px 20px; border-bottom: 4px dashed #ff3333; display: inline-block; font-weight: 900; }
        .style-8 { color: #76ff03; -webkit-text-stroke: 1.5px #004d40; text-shadow: 3px 3px 0 #000; font-weight: bold; }
        .style-9 { background: #d32f2f; color: #fff; border-left: 12px solid #ffeb3b; padding: 5px 15px; display: inline-block; }
        .style-10 { color: #ff9800; -webkit-text-stroke: 2px #4a148c; text-shadow: 3px 3px 0 #000; font-weight: 900; }
        .style-11 { color: #fff; text-shadow: 0 0 5px #00b0ff, 0 0 10px #00b0ff, 0 0 15px #00b0ff, 0 0 20px #00b0ff; }
        .style-12 { background: #ffeb3b; color: #d32f2f; border: 3px solid #d32f2f; padding: 5px 20px; border-radius: 15px; box-shadow: 4px 4px 0 #000; display: inline-block; }
        .style-13 { color: #ffd54f; background: #222; border: 2px solid #ffd54f; display: inline-block; padding: 5px 20px; box-shadow: inset 0 0 10px #000; }
        .style-14 { color: #fff; text-shadow: 0 0 5px #d500f9, 0 0 10px #d500f9, 0 0 20px #d500f9; }
        .style-15 { background: #fff; color: #d32f2f; -webkit-text-stroke: 1px #000; text-shadow: 4px 4px 0 rgba(0,0,0,0.2); border: 2px solid #111; display: inline-block; padding: 5px 15px; }
        .style-16 { color: #b71c1c; font-weight: 900; -webkit-text-stroke: 2px #fff; text-shadow: 3px 3px 0 #000; letter-spacing: 1px; }

        .bullets-box { padding: 10px 15px; border-radius: 5px; margin: 5px 0; }
        .bullets-none { padding: 5px 15px; background: transparent; }
        .bullets-list { margin: 0; padding-left: 20px; font-size: 16px; font-family: 'Mandali', sans-serif; line-height: 1.5; color: #222; text-align: left; }
        .bullets-list li { margin-bottom: 5px; }
        
        .image-container { text-align: center; display: block; box-sizing: border-box; margin-bottom:10px; }
        .image-container img { width: 100%; height: auto; display: block; object-fit: cover; } 
        .caption { font-size: 12px; font-weight: bold; margin-top: 3px; color: #222; text-align: center; }
        
        .stamp-container { display: block; box-sizing: border-box; margin: 10px; shape-outside: circle(50%); border-radius: 50%; overflow: hidden; }
        .stamp-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Utilities for layout */
        .img-block { display: block; margin: 0 auto 15px auto !important; clear: both; }
        .img-float-left { float: left; margin: 0 15px 10px 0 !important; }
        .img-float-right { float: right; margin: 0 0 10px 15px !important; }
        
        #out-prefix-center { text-align: center; margin-bottom: 15px; width: 100%; }
        .news-body { column-count: 2; column-gap: 20px; column-rule: 1px solid #bbb; text-align: justify; font-size: 17px; line-height: 1.5; font-family: 'Tiro Telugu', serif; color: #111; margin-top: 10px; }
        .news-body p { margin: 0 0 10px 0; text-indent: 25px; }
        .news-body p::after { content: ""; display: table; clear: none; }
        
        @media (max-width: 900px) { .app-container { flex-direction: column; overflow: auto;} .controls-panel { width: 100%; } .newspaper-wrapper { transform: scale(0.9); transform-origin: top center;} }
    </style>
</head>
<body>

    <div class="app-container">
      <div class="controls-panel">
        <h2>🛠️ Clipping Tools</h2>
        
        <!-- 1. Save/Load -->
        <details>
            <summary>💾 1. Save & Load Project</summary>
            <div class="tool-section">
                <button class="save-btn" onclick="saveProjectData()">💾 Save Current Work</button>
                <button class="load-btn" onclick="loadProjectData()">🔄 Load Last Saved Work</button>
            </div>
        </details>
        
        <!-- 2. Width & Bg -->
        <details>
            <summary>📐 2. Clipping Width & Background</summary>
            <div class="tool-section">
                <label>Clipping Width: <span id="val-wrap-w">800</span>px</label>
                <input type="range" id="in-wrap-w" min="500" max="2000" step="10" value="800">
                <label><input type="checkbox" id="in-overall-box-check"> Enable Overall Background Box?</label>
                <input type="color" id="in-overall-color" value="#fcfad9">
            </div>
        </details>
    
        <!-- 3. Logo -->
        <details>
            <summary>📰 3. Newspaper Logo Settings</summary>
            <div class="tool-section">
                <label>Select Logo Type:</label>
                <select id="in-logo-type">
                  <option value="top">Top Header Logo</option>
                  <option value="stamp">Round Seal in Text</option>
                </select>
                
                <div id="top-logo-controls">
                  <label>Upload Top Logo:</label>
                  <input type="file" id="in-logo-top" accept="image/*">
                  <button class="action-btn" onclick="saveLogoToStorage('top')">Save this Logo</button>
                  <label>Saved Logos:</label>
                  <div class="logo-gallery" id="saved-top-logos"></div>
                  
                  <label><input type="checkbox" id="in-logo-line-check" checked> Enable Divider Line Below Logo?</label>
                  <div class="flex-row">
                    <label>Line Color:</label>
                    <input type="color" id="in-logo-line-color" value="#000000">
                  </div>
                </div>
                
                <div id="stamp-logo-controls" style="display:none;">
                  <label>Upload Round Stamp:</label>
                  <input type="file" id="in-logo-stamp" accept="image/*">
                  <button class="action-btn" onclick="saveLogoToStorage('stamp')">Save this Stamp</button>
                  <div class="logo-gallery" id="saved-stamp-logos"></div>
                  <label>Alignment:</label>
                  <select id="stamp-align">
                    <option value="center">Center</option>
                    <option value="left">Left</option>
                    <option value="right">Right</option>
                  </select>
                  <label>Size (%):</label> 
                  <input type="range" id="stamp-w" min="10" max="100" step="1" value="30">
                  <label>Position in Text (%):</label> 
                  <input type="range" id="stamp-para-pos" min="0" max="100" step="1" value="50">
                </div>
            </div>
        </details>
    
        <!-- 4. Sub Headline -->
        <details>
            <summary>📝 4. Sub Headline</summary>
            <div class="tool-section">
                <input type="text" id="in-sub-headline" value="" placeholder="Type Sub Headline here...">
                <div class="flex-row">
                  <select id="in-sub-font">
                    <option value="'Mandali', sans-serif">Mandali</option>
                    <option value="'Ramabhadra', sans-serif">Ramabhadra</option>
                    <option value="'Mallanna', sans-serif">Mallanna</option>
                    <option value="'Dhurjati', sans-serif">Dhurjati</option>
                    <option value="'TenaliRamakrishna', sans-serif">TenaliRamakrishna</option>
                    <option value="'Gidugu', sans-serif">Gidugu</option>
                    <option value="'Suravaram', sans-serif">Suravaram</option>
                    <option value="'Timmana', sans-serif">Timmana</option>
                    <option value="'Ramaraja', serif">Ramaraja</option>
                    <option value="'Ravi Prakash', cursive">Ravi Prakash</option>
                  </select>
                  <input type="color" id="in-sub-color" value="#cc0000">
                </div>
                <label>Size: <span id="val-sub-size">18</span>px</label>
                <input type="range" id="in-sub-size" min="12" max="40" step="1" value="18">
                
                <label>Line Spacing:</label>
                <input type="range" id="in-sub-lh" min="0.5" max="3" step="0.1" value="1.3">

                <label>Move Up/Down (Y-Position):</label>
                <input type="range" id="in-sub-y" min="-50" max="50" step="1" value="0">
            </div>
        </details>
    
        <!-- 5. Main Headline -->
        <details>
            <summary>💥 5. Main Headline</summary>
            <div class="tool-section">
                <textarea id="in-main-headline" rows="2" placeholder="Type Main Headline here..."></textarea>
                
                <label style="color:red;">Select Headline Mode:</label>
                <select id="in-main-mode">
                    <option value="normal">Normal Headline</option>
                    <option value="special">16 Premium Styles</option>
                </select>

                <div id="normal-head-controls" style="margin-top:10px;">
                    <div class="flex-row">
                      <select id="in-main-font">
                        <option value="'Ramabhadra', sans-serif">Ramabhadra</option>
                        <option value="'Dhurjati', sans-serif">Dhurjati</option>
                        <option value="'Mallanna', sans-serif">Mallanna</option>
                        <option value="'TenaliRamakrishna', sans-serif">TenaliRamakrishna</option>
                        <option value="'Timmana', sans-serif">Timmana</option>
                        <option value="'Ramaraja', serif">Ramaraja</option>
                      </select>
                      <input type="color" id="in-main-color" value="#002b80">
                    </div>
                    <label><input type="checkbox" id="in-main-bg-check"> Enable Background Color Box?</label>
                    <input type="color" id="in-main-bg-color" value="#002b80">
                    
                    <label style="color:#d32f2f; margin-top:10px;"><input type="checkbox" id="in-main-stroke-check"> <b>Enable Text Stroke (Outline)?</b></label>
                    <div class="flex-row">
                        <input type="color" id="in-main-stroke-color" value="#ffffff" title="Stroke Color">
                        <input type="range" id="in-main-stroke-w" min="1" max="5" step="1" value="1" title="Stroke Thickness">
                    </div>
                </div>

                <div id="special-head-controls" style="display:none; margin-top:10px; background:#f4f4f4; padding:10px; border:1px solid #ccc;">
                    <label>Select Premium Style:</label>
                    <select id="in-special-style">
                        <option value="style-1">Style 1 (3D Gold)</option>
                        <option value="style-2">Style 2 (Brush)</option>
                        <option value="style-3">Style 3 (Metallic)</option>
                        <option value="style-4">Style 4 (Outline)</option>
                        <option value="style-5">Style 5 (Elegant Gold)</option>
                        <option value="style-6">Style 6 (Blue Gradient)</option>
                        <option value="style-7">Style 7 (Grunge)</option>
                        <option value="style-8">Style 8 (Green & Yellow)</option>
                        <option value="style-9">Style 9 (Dynamic Red)</option>
                        <option value="style-10">Style 10 (Rural Orange)</option>
                        <option value="style-11">Style 11 (Neon Blue)</option>
                        <option value="style-12">Style 12 (Highlight)</option>
                        <option value="style-13">Style 13 (Matte Gold)</option>
                        <option value="style-14">Style 14 (Neon Pink)</option>
                        <option value="style-15">Style 15 (Paint)</option>
                        <option value="style-16">Style 16 (Bold Impact)</option>
                    </select>
                </div>

                <label>Size: <span id="val-main-size">36</span>px</label>
                <input type="range" id="in-main-size" min="20" max="80" step="1" value="36">
                
                <label>Line Spacing:</label>
                <input type="range" id="in-main-lh" min="0.5" max="3" step="0.1" value="1.3">

                <label>Move Up/Down (Y-Position):</label>
                <input type="range" id="in-main-y" min="-50" max="50" step="1" value="0">
            </div>
        </details>

        <!-- 6. Bullet Points -->
        <details>
            <summary>📌 6. Bullet Points</summary>
            <div class="tool-section">
                <label>Points (One per line):</label>
                <textarea id="in-bullets" rows="4" placeholder="Type bullet points here..."></textarea>
                
                <!-- Bullet Layout Selection -->
                <label>Alignment:</label>
                <select id="in-bullets-align">
                  <option value="top">Top Center (Below Main Heading)</option>
                  <option value="left">Left Wrap in News Body</option>
                  <option value="right">Right Wrap in News Body</option>
                </select>

                <!-- Dynamic Position in Text (Visible only if Left/Right) -->
                <div id="bullets-pos-control" style="display:none; margin-top:5px;">
                    <label>Position in Text (%):</label> 
                    <input type="range" id="bullets-para-pos" min="0" max="100" step="1" value="0">
                </div>

                <label><input type="checkbox" id="in-bullets-box-check"> Enable Background Box?</label>
                <input type="color" id="in-bullets-bg-color" value="#e3f2fd">
                <label>Size:</label>
                <input type="range" id="in-bullets-size" min="12" max="25" step="1" value="16">
                
                <label>Move Up/Down (Y-Position):</label>
                <input type="range" id="in-bullets-y" min="-50" max="50" step="1" value="0">
            </div>
        </details>
    
        <!-- 7. Images -->
        <details>
            <summary>🖼️ 7. Images (Frames & Stroke)</summary>
            <div class="tool-section">
                <label><b>Image 1:</b></label>
                <input type="file" id="in-image-1" accept="image/*">
                
                <label>Frame Shape:</label>
                <select id="img-frame-1">
                    <option value="none">Normal (Rectangle)</option>
                    <option value="rounded">Slightly Rounded</option>
                    <option value="circle">Full Circle</option>
                    <option value="leaf">Leaf Shape</option>
                    <option value="arch">Arch Shape</option>
                </select>
                
                <label style="color:#002b80"><input type="checkbox" id="img-stroke-check-1"> Enable Frame Border (Stroke)?</label>
                <div class="flex-row">
                    <input type="color" id="img-stroke-color-1" value="#000000">
                    <input type="range" id="img-stroke-w-1" min="1" max="15" step="1" value="2">
                </div>

                <label><input type="checkbox" id="check-cap-1" checked> Enable Caption?</label>
                <input type="text" id="in-caption-1" value="" placeholder="Caption 1">
                <label>Alignment:</label>
                <select id="img-align-1">
                  <option value="top">Top Center</option>
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                </select>
                <label>Position in Text (%):</label> <input type="range" id="img-para-1" min="0" max="100" step="1" value="0">
                <label>Width (%):</label> <input type="range" id="img-w-1" min="20" max="100" step="1" value="100">
                
                <hr>
                
                <label><b>Image 2:</b></label>
                <input type="file" id="in-image-2" accept="image/*">
                
                <label>Frame Shape:</label>
                <select id="img-frame-2">
                    <option value="none">Normal (Rectangle)</option>
                    <option value="rounded">Slightly Rounded</option>
                    <option value="circle">Full Circle</option>
                    <option value="leaf">Leaf Shape</option>
                    <option value="arch">Arch Shape</option>
                </select>
                
                <label style="color:#002b80"><input type="checkbox" id="img-stroke-check-2"> Enable Frame Border (Stroke)?</label>
                <div class="flex-row">
                    <input type="color" id="img-stroke-color-2" value="#000000">
                    <input type="range" id="img-stroke-w-2" min="1" max="15" step="1" value="2">
                </div>

                <label><input type="checkbox" id="check-cap-2"> Enable Caption?</label>
                <input type="text" id="in-caption-2" value="" placeholder="Caption 2">
                <label>Position in Text (%):</label> <input type="range" id="img-para-2" min="0" max="100" step="1" value="50">
                <label>Width (%):</label> <input type="range" id="img-w-2" min="20" max="100" step="1" value="50">
            </div>
        </details>
    
        <!-- 8. News Body & Prefix -->
        <details>
            <summary>✍️ 8. News Body & Prefix</summary>
            <div class="tool-section">
                <label>Prefix before News Body (e.g. Reporter):</label>
                <div class="flex-row">
                    <input type="text" id="in-news-prefix" placeholder="Ex: Reporter Name :">
                    <button class="action-btn" onclick="savePrefix()">Save</button>
                </div>
                <select id="saved-prefixes" onchange="document.getElementById('in-news-prefix').value=this.value; rebuildNewsBody();" style="margin-top:5px;">
                    <option value="">-- Saved Prefixes Here --</option>
                </select>
                
                <div class="flex-row" style="margin-top:10px;">
                    <label style="margin-top:0;"><input type="checkbox" id="in-news-prefix-bold" checked> Bold Text</label>
                    <input type="color" id="in-news-prefix-color" value="#d32f2f">
                </div>
                <label>Prefix Layout Position:</label>
                <select id="in-news-prefix-layout">
                    <option value="inline">Inline with News</option>
                    <option value="center">Center Top of News Body</option>
                </select>

                <hr style="margin:15px 0; border:0; border-top:1px dashed #ccc;">

                <label>Number of Columns:</label>
                <select id="in-columns">
                  <option value="1">1 Column</option>
                  <option value="2" selected>2 Columns</option>
                  <option value="3">3 Columns</option>
                </select>
                <label>News Body Font Style:</label>
                <select id="in-body-font">
                  <option value="'Tiro Telugu', serif">Tiro Telugu</option>
                  <option value="'NTR', sans-serif">NTR</option>
                  <option value="'Sree Krushnadevaraya', serif">Sree Krushnadevaraya</option>
                  <option value="'Ponnala', sans-serif">Ponnala</option>
                  <option value="'Mandali', sans-serif">Mandali</option>
                </select>
                <label>Font Size: <span id="val-body-size">17</span>px</label>
                <input type="range" id="in-body-size" min="12" max="25" step="1" value="17">
                
                <label>Line Spacing:</label>
                <input type="range" id="in-body-lh" min="1.0" max="3.0" step="0.1" value="1.5">

                <textarea id="in-news-body" rows="8" placeholder="Type or paste your news content here..."></textarea>
            </div>
        </details>
    
        <button id="main-download-btn" class="download-btn" onclick="downloadClipping()">⬇️ Download as Image</button>
      </div>
    
      <div class="preview-panel">
        <div class="newspaper-wrapper" id="capture-area">
          <div class="paper-header" id="out-header-top">
            <img id="out-logo-top" src="https://via.placeholder.com/600x100?text=Upload+Your+Newspaper+Logo" alt="Paper Logo">
          </div>
          
          <div id="out-overall-wrap" class="overall-wrap-none">
            
            <div id="out-sub-wrap">
                <div class="sub-headline" id="out-sub-headline"></div>
            </div>

            <div id="out-main-wrap">
                <div class="main-headline-box" id="out-main-headline"></div>
            </div>
            
            <!-- Bullets container for 'Top' alignment -->
            <div id="top-bullets-dock"></div>

            <div id="out-prefix-center"></div>

            <div id="image-storage" style="display:none;">
               <div class="image-container img-block" id="out-image-container-1">
                  <img id="out-image-1" src="https://via.placeholder.com/800x400?text=Upload+Image+1">
                  <div class="caption" id="out-caption-1"></div>
               </div>
               <div class="image-container img-block" id="out-image-container-2">
                  <img id="out-image-2" src="https://via.placeholder.com/400x300?text=Upload+Image+2">
                  <div class="caption" id="out-caption-2" style="display:none;"></div>
               </div>
               <div class="stamp-container img-block" id="out-stamp-container">
                  <img id="out-logo-stamp" src="https://via.placeholder.com/200x200?text=Round+Seal">
               </div>
               
               <!-- Bullets Storage for DOM moving -->
               <div id="out-bullets-wrap">
                   <div id="out-bullets-container" class="bullets-none">
                       <ul class="bullets-list" id="out-bullets-list"></ul>
                   </div>
               </div>

            </div>
    
            <div id="top-image-dock"></div> 
            
            <div class="news-body" id="out-news-body">
              <span id="news-text-content"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            let wrapper = document.createElement('div');
            wrapper.className = 'range-container';
            slider.parentNode.insertBefore(wrapper, slider);
            
            let btnMinus = document.createElement('button');
            btnMinus.type = 'button';
            btnMinus.innerHTML = '◄';
            btnMinus.className = 'range-btn';
            btnMinus.onclick = () => { slider.stepDown(); slider.dispatchEvent(new Event('input')); };
            
            let btnPlus = document.createElement('button');
            btnPlus.type = 'button';
            btnPlus.innerHTML = '►';
            btnPlus.className = 'range-btn';
            btnPlus.onclick = () => { slider.stepUp(); slider.dispatchEvent(new Event('input')); };
            
            wrapper.appendChild(btnMinus);
            wrapper.appendChild(slider);
            wrapper.appendChild(btnPlus);
        });

        // Smart Text Binding (Hides wrapper if empty)
        function bindTextDynamic(inId, outId, wrapId, isHtml = false) {
          document.getElementById(inId).addEventListener('input', function() {
            let val = this.value.trim();
            let wrap = document.getElementById(wrapId);
            if (val === '') {
                wrap.style.display = 'none';
                document.getElementById(outId).innerHTML = '';
            } else {
                wrap.style.display = 'block';
                if(isHtml) document.getElementById(outId).innerHTML = this.value.replace(/\n/g, '<br>');
                else document.getElementById(outId).innerText = this.value;
            }
          });
          // Initial trigger
          document.getElementById(inId).dispatchEvent(new Event('input'));
        }
        
        bindTextDynamic('in-sub-headline', 'out-sub-headline', 'out-sub-wrap');
        bindTextDynamic('in-main-headline', 'out-main-headline', 'out-main-wrap', true);

        // Standard bindings for captions
        function bindText(inId, outId) {
          document.getElementById(inId).addEventListener('input', function() {
             document.getElementById(outId).innerText = this.value;
          });
        }
        bindText('in-caption-1', 'out-caption-1');
        bindText('in-caption-2', 'out-caption-2');
        
        document.getElementById('in-wrap-w').addEventListener('input', function() {
          document.getElementById('val-wrap-w').innerText = this.value;
          document.getElementById('capture-area').style.width = this.value + 'px';
        });
        
        function updateOverallBox() {
          let wrap = document.getElementById('out-overall-wrap');
          if(document.getElementById('in-overall-box-check').checked) {
            wrap.className = 'overall-wrap-active';
            wrap.style.backgroundColor = document.getElementById('in-overall-color').value;
          } else {
            wrap.className = 'overall-wrap-none';
            wrap.style.backgroundColor = 'transparent';
          }
        }
        document.getElementById('in-overall-box-check').addEventListener('change', updateOverallBox);
        document.getElementById('in-overall-color').addEventListener('input', updateOverallBox);
        
        let isStampMode = false;
        let stampUploaded = false;
        
        document.getElementById('in-logo-type').addEventListener('change', function() {
          if(this.value === 'stamp') {
            document.getElementById('top-logo-controls').style.display = 'none';
            document.getElementById('stamp-logo-controls').style.display = 'block';
            document.getElementById('out-header-top').style.display = 'none';
            isStampMode = true;
          } else {
            document.getElementById('top-logo-controls').style.display = 'block';
            document.getElementById('stamp-logo-controls').style.display = 'none';
            document.getElementById('out-header-top').style.display = 'block';
            isStampMode = false;
          }
          rebuildNewsBody(); 
        });
        
        function updateLogoLine() {
          if (document.getElementById('in-logo-line-check').checked) {
            document.getElementById('out-header-top').style.borderBottom = `2px solid ${document.getElementById('in-logo-line-color').value}`;
          } else {
            document.getElementById('out-header-top').style.borderBottom = 'none';
          }
        }
        document.getElementById('in-logo-line-check').addEventListener('change', updateLogoLine);
        document.getElementById('in-logo-line-color').addEventListener('input', updateLogoLine);
        
        document.getElementById('in-logo-top').addEventListener('change', e => loadLogoFile(e, 'out-logo-top'));
        document.getElementById('in-logo-stamp').addEventListener('change', e => { loadLogoFile(e, 'out-logo-stamp'); stampUploaded = true; rebuildNewsBody(); });
        
        function loadLogoFile(e, outId) {
            if(e.target.files && e.target.files[0]) {
                let reader = new FileReader();
                reader.onload = event => document.getElementById(outId).src = event.target.result;
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        document.getElementById('stamp-align').addEventListener('change', rebuildNewsBody);
        document.getElementById('stamp-w').addEventListener('input', function() { document.getElementById('out-stamp-container').style.width = this.value + '%'; });
        document.getElementById('stamp-para-pos').addEventListener('input', rebuildNewsBody);

        document.getElementById('in-sub-font').addEventListener('change', e => document.getElementById('out-sub-headline').style.fontFamily = e.target.value);
        document.getElementById('in-sub-color').addEventListener('input', e => document.getElementById('out-sub-headline').style.color = e.target.value);
        document.getElementById('in-sub-size').addEventListener('input', function() { document.getElementById('val-sub-size').innerText = this.value; document.getElementById('out-sub-headline').style.fontSize = this.value + 'px'; });
        document.getElementById('in-sub-lh').addEventListener('input', function() { document.getElementById('out-sub-headline').style.lineHeight = this.value; });
        document.getElementById('in-sub-y').addEventListener('input', function() { document.getElementById('out-sub-wrap').style.top = this.value + 'px'; });

        function updateMainHeadlineBox() {
          let hl = document.getElementById('out-main-headline');
          let mode = document.getElementById('in-main-mode').value;
          
          hl.className = '';
          hl.style = ''; 
          hl.style.fontSize = document.getElementById('in-main-size').value + 'px';
          hl.style.fontFamily = document.getElementById('in-main-font').value;
          hl.style.lineHeight = document.getElementById('in-main-lh').value;
          
          if(mode === 'normal') {
              let txtColor = document.getElementById('in-main-color').value;
              let bgColor = document.getElementById('in-main-bg-color').value;
              let isBox = document.getElementById('in-main-bg-check').checked;
              
              if (isBox) {
                hl.classList.add('main-headline-box');
                hl.style.backgroundColor = bgColor;
                hl.style.color = txtColor === '#002b80' ? '#ffffff' : txtColor; 
              } else {
                hl.classList.add('main-headline-text');
                hl.style.color = txtColor;
              }
              
              if(document.getElementById('in-main-stroke-check').checked) {
                  let strokeW = document.getElementById('in-main-stroke-w').value;
                  let strokeC = document.getElementById('in-main-stroke-color').value;
                  hl.style.webkitTextStroke = `${strokeW}px ${strokeC}`;
              } else {
                  hl.style.webkitTextStroke = 'none';
              }
          } else {
              let selectedStyle = document.getElementById('in-special-style').value;
              hl.classList.add('main-headline-text'); 
              hl.classList.add(selectedStyle); 
          }
        }
        
        document.getElementById('in-main-mode').addEventListener('change', function() {
            if(this.value === 'normal') {
                document.getElementById('normal-head-controls').style.display = 'block';
                document.getElementById('special-head-controls').style.display = 'none';
            } else {
                document.getElementById('normal-head-controls').style.display = 'none';
                document.getElementById('special-head-controls').style.display = 'block';
            }
            updateMainHeadlineBox();
        });

        document.getElementById('in-main-font').addEventListener('change', updateMainHeadlineBox);
        document.getElementById('in-main-color').addEventListener('input', updateMainHeadlineBox);
        document.getElementById('in-main-bg-color').addEventListener('input', updateMainHeadlineBox);
        document.getElementById('in-main-bg-check').addEventListener('change', updateMainHeadlineBox);
        document.getElementById('in-main-stroke-check').addEventListener('change', updateMainHeadlineBox);
        document.getElementById('in-main-stroke-color').addEventListener('input', updateMainHeadlineBox);
        document.getElementById('in-main-stroke-w').addEventListener('input', updateMainHeadlineBox);
        document.getElementById('in-special-style').addEventListener('change', updateMainHeadlineBox);
        document.getElementById('in-main-size').addEventListener('input', function() { document.getElementById('val-main-size').innerText = this.value; document.getElementById('out-main-headline').style.fontSize = this.value + 'px'; });
        document.getElementById('in-main-lh').addEventListener('input', updateMainHeadlineBox);
        document.getElementById('in-main-y').addEventListener('input', function() { document.getElementById('out-main-wrap').style.top = this.value + 'px'; });

        // UPDATED BULLET LOGIC: Rebuild News Body on Alignment Change
        document.getElementById('in-bullets-align').addEventListener('change', function() {
            let val = this.value;
            let posCtrl = document.getElementById('bullets-pos-control');
            if(val === 'top') posCtrl.style.display = 'none';
            else posCtrl.style.display = 'block';
            rebuildNewsBody();
        });

        function updateBullets() {
            let text = document.getElementById('in-bullets').value;
            let wrap = document.getElementById('out-bullets-wrap');
            let container = document.getElementById('out-bullets-container');
            let list = document.getElementById('out-bullets-list');
            
            if(text.trim() === '') { 
                wrap.style.display = 'none'; 
                list.innerHTML = '';
            } else {
                wrap.style.display = 'block';
                let points = text.split('\n').filter(p => p.trim() !== '');
                list.innerHTML = '';
                points.forEach(pt => { let li = document.createElement('li'); li.innerText = pt; list.appendChild(li); });
                
                let isBox = document.getElementById('in-bullets-box-check').checked;
                let bgColor = document.getElementById('in-bullets-bg-color').value;
                
                if(isBox) { container.className = 'bullets-box'; container.style.backgroundColor = bgColor; } 
                else { container.className = 'bullets-none'; container.style.backgroundColor = 'transparent'; }
                
                list.style.fontSize = document.getElementById('in-bullets-size').value + 'px';
            }
            rebuildNewsBody();
        }
        
        document.getElementById('in-bullets').addEventListener('input', updateBullets);
        document.getElementById('in-bullets-box-check').addEventListener('change', updateBullets);
        document.getElementById('in-bullets-bg-color').addEventListener('input', updateBullets);
        document.getElementById('in-bullets-size').addEventListener('input', updateBullets);
        document.getElementById('in-bullets-y').addEventListener('input', function() { document.getElementById('out-bullets-wrap').style.top = this.value + 'px'; });
        document.getElementById('bullets-para-pos').addEventListener('input', rebuildNewsBody);

        function applyImageFrameAndStroke(imgNum) {
            let imgEl = document.getElementById(`out-image-${imgNum}`);
            let frame = document.getElementById(`img-frame-${imgNum}`).value;
            let isStroke = document.getElementById(`img-stroke-check-${imgNum}`).checked;
            
            if(frame === 'none') { imgEl.style.borderRadius = '0'; imgEl.style.aspectRatio = 'auto'; }
            else if(frame === 'rounded') { imgEl.style.borderRadius = '15px'; imgEl.style.aspectRatio = 'auto'; }
            else if(frame === 'circle') { imgEl.style.borderRadius = '50%'; imgEl.style.aspectRatio = '1 / 1'; }
            else if(frame === 'leaf') { imgEl.style.borderRadius = '0 50% 0 50%'; imgEl.style.aspectRatio = 'auto'; }
            else if(frame === 'arch') { imgEl.style.borderRadius = '100px 100px 0 0'; imgEl.style.aspectRatio = 'auto'; }
            
            if(isStroke) {
                let sColor = document.getElementById(`img-stroke-color-${imgNum}`).value;
                let sWidth = document.getElementById(`img-stroke-w-${imgNum}`).value;
                imgEl.style.border = `${sWidth}px solid ${sColor}`;
            } else {
                imgEl.style.border = '1px solid transparent';
            }
        }

        let imgState = { 1: { uploaded: false, align: 'top' }, 2: { uploaded: false, align: 'right' } };
        function setupImageControl(imgNum) {
          document.getElementById(`in-image-${imgNum}`).addEventListener('change', function(e) {
            if(e.target.files && e.target.files[0]) {
              let reader = new FileReader();
              reader.onload = event => { document.getElementById(`out-image-${imgNum}`).src = event.target.result; imgState[imgNum].uploaded = true; applyImageFrameAndStroke(imgNum); rebuildNewsBody(); }
              reader.readAsDataURL(e.target.files[0]);
            }
          });
          document.getElementById(`check-cap-${imgNum}`).addEventListener('change', function() { document.getElementById(`out-caption-${imgNum}`).style.display = this.checked ? 'block' : 'none'; });
          document.getElementById(`img-w-${imgNum}`).addEventListener('input', function(){ document.getElementById(`out-image-container-${imgNum}`).style.width = this.value + '%'; });
          
          let alignEl = document.getElementById(`img-align-${imgNum}`);
          if(alignEl) alignEl.addEventListener('change', function() { imgState[imgNum].align = this.value; rebuildNewsBody(); });
          document.getElementById(`img-para-${imgNum}`).addEventListener('input', rebuildNewsBody);
          
          document.getElementById(`img-frame-${imgNum}`).addEventListener('change', () => applyImageFrameAndStroke(imgNum));
          document.getElementById(`img-stroke-check-${imgNum}`).addEventListener('change', () => applyImageFrameAndStroke(imgNum));
          document.getElementById(`img-stroke-color-${imgNum}`).addEventListener('input', () => applyImageFrameAndStroke(imgNum));
          document.getElementById(`img-stroke-w-${imgNum}`).addEventListener('input', () => applyImageFrameAndStroke(imgNum));
        }
        setupImageControl(1); setupImageControl(2);

        document.getElementById('in-body-font').addEventListener('change', e => document.getElementById('out-news-body').style.fontFamily = e.target.value);
        document.getElementById('in-columns').addEventListener('change', e => document.getElementById('out-news-body').style.columnCount = e.target.value);
        document.getElementById('in-body-size').addEventListener('input', function() { document.getElementById('val-body-size').innerText = this.value; document.getElementById('out-news-body').style.fontSize = this.value + 'px'; });
        document.getElementById('in-body-lh').addEventListener('input', function() { document.getElementById('out-news-body').style.lineHeight = this.value; });
        
        let rawNewsText = document.getElementById('in-news-body').value;
        document.getElementById('in-news-body').addEventListener('input', function() { rawNewsText = this.value; rebuildNewsBody(); });

        document.getElementById('in-news-prefix').addEventListener('input', rebuildNewsBody);
        document.getElementById('in-news-prefix-bold').addEventListener('change', rebuildNewsBody);
        document.getElementById('in-news-prefix-color').addEventListener('input', rebuildNewsBody);
        document.getElementById('in-news-prefix-layout').addEventListener('change', rebuildNewsBody);

        function rebuildNewsBody() {
          let rawParagraphs = rawNewsText.split('\n').filter(p => p.trim() !== '');
          if (rawParagraphs.length === 0) rawParagraphs = [""];
          
          let containerNode = document.getElementById('news-text-content');
          let topDock = document.getElementById('top-image-dock');
          let storage = document.getElementById('image-storage');
          let centerPrefixWrap = document.getElementById('out-prefix-center');
          let topBulletsDock = document.getElementById('top-bullets-dock');
          let outBulletsWrap = document.getElementById('out-bullets-wrap');
          
          // Send all dynamic elements back to storage before rebuild
          ['out-image-container-1', 'out-image-container-2', 'out-stamp-container', 'out-bullets-wrap'].forEach(id => {
            let el = document.getElementById(id);
            if(el) storage.appendChild(el);
          });
          
          containerNode.innerHTML = '';
          topDock.innerHTML = '';
          centerPrefixWrap.innerHTML = '';
          topBulletsDock.innerHTML = '';
          
          let pText = document.getElementById('in-news-prefix').value.trim();
          let pBold = document.getElementById('in-news-prefix-bold').checked ? 'bold' : 'normal';
          let pColor = document.getElementById('in-news-prefix-color').value;
          let pLayout = document.getElementById('in-news-prefix-layout').value;
          
          let prefixEl = null;
          if(pText !== "") {
              if(pLayout === 'center') {
                  let prefixHtml = `<span style="color:${pColor}; font-weight:${pBold}; margin-right:8px;">${pText}</span>`;
                  centerPrefixWrap.innerHTML = `<h3 style="margin:0; font-family:'Mandali',sans-serif;">${prefixHtml}</h3>`;
              } else if(pLayout === 'inline') {
                  prefixEl = document.createElement('span');
                  prefixEl.style.color = pColor;
                  prefixEl.style.fontWeight = pBold;
                  prefixEl.style.marginRight = '8px';
                  prefixEl.innerText = pText;
              }
          }
          
          function prepElement(elId, align) {
            let el = document.getElementById(elId);
            if(!el) return null;
            el.classList.remove('img-block', 'img-float-left', 'img-float-right');
            
            // Do not force display:block if it's bullets and empty
            if(elId === 'out-bullets-wrap' && document.getElementById('in-bullets').value.trim() === '') {
                el.style.display = 'none';
                return null;
            } else {
                el.style.display = 'block'; 
            }
            
            if(align === 'top' && elId !== 'out-stamp-container' && elId !== 'out-bullets-wrap') { el.classList.add('img-block'); topDock.appendChild(el); return null; }
            if(align === 'top' && elId === 'out-bullets-wrap') { el.classList.add('img-block'); topBulletsDock.appendChild(el); return null;}
            
            if(align === 'left') el.classList.add('img-float-left');
            else if(align === 'right') el.classList.add('img-float-right');
            else if(align === 'center' && elId === 'out-stamp-container') { el.classList.add('img-float-left'); el.style.margin = "10px 15px 10px 15px"; }
            return el;
          }
        
          let el1 = (imgState[1].uploaded || document.getElementById('out-image-1').src.includes("via.placeholder")) ? prepElement('out-image-container-1', document.getElementById('img-align-1').value) : null;
          let el2 = (imgState[2].uploaded) ? prepElement('out-image-container-2', 'right') : null;
          let elStamp = (isStampMode && stampUploaded) ? prepElement('out-stamp-container', document.getElementById('stamp-align').value) : null;
          let elBullets = prepElement('out-bullets-wrap', document.getElementById('in-bullets-align').value);
        
          let totalWords = 0;
          rawParagraphs.forEach(p => { totalWords += p.split(/\s+/).filter(w=>w.length>0).length; });
        
          let pos1 = el1 ? parseInt(document.getElementById('img-para-1').value) : 0;
          let pos2 = el2 ? parseInt(document.getElementById('img-para-2').value) : 50;
          let posStamp = elStamp ? parseInt(document.getElementById('stamp-para-pos').value) : 50;
          let posBullets = elBullets ? parseInt(document.getElementById('bullets-para-pos').value) : 0;
          
          let targetWord1 = Math.floor(totalWords * (pos1 / 100));
          let targetWord2 = Math.floor(totalWords * (pos2 / 100));
          let targetWordStamp = Math.floor(totalWords * (posStamp / 100));
          let targetWordBullets = Math.floor(totalWords * (posBullets / 100));
          
          let injections = [];
          if(el1) injections.push({ idx: targetWord1, el: el1 });
          if(el2) injections.push({ idx: targetWord2, el: el2 });
          if(elStamp) injections.push({ idx: targetWordStamp, el: elStamp });
          if(elBullets) injections.push({ idx: targetWordBullets, el: elBullets});
          
          let currentWordIndex = 0;
          
          rawParagraphs.forEach((text, pIdx) => {
            let pNode = document.createElement('p');
            let words = text.split(/\s+/).filter(w=>w.length>0);
            
            if(words.length === 0) {
                let injectHere = injections.filter(inj => inj.idx === currentWordIndex);
                injectHere.forEach(inj => pNode.appendChild(inj.el));
                if(pIdx === 0 && prefixEl) pNode.appendChild(prefixEl); 
            } else {
                let currentText = "";
                for(let i=0; i<words.length; i++) {
                    let injectHere = injections.filter(inj => inj.idx === currentWordIndex);
                    if(injectHere.length > 0) {
                        if(currentText !== "") { pNode.appendChild(document.createTextNode(currentText)); currentText = ""; }
                        
                        injectHere.forEach(inj => pNode.appendChild(inj.el));
                    }
                    
                    if(pIdx === 0 && i === 0 && prefixEl) {
                        pNode.appendChild(prefixEl);
                    }
                    
                    currentText += words[i] + " ";
                    currentWordIndex++;
                }
                if(currentText !== "") pNode.appendChild(document.createTextNode(currentText));
            }
            if (pIdx === rawParagraphs.length - 1) {
                let endInjections = injections.filter(inj => inj.idx >= totalWords);
                endInjections.forEach(inj => pNode.appendChild(inj.el));
            }
            containerNode.appendChild(pNode);
          });
        }
        rebuildNewsBody();

        function saveLogoToStorage(type) {
            let imgEl = document.getElementById(type === 'top' ? 'out-logo-top' : 'out-logo-stamp');
            if(imgEl.src.includes("via.placeholder")) { alert("Please upload a logo first!"); return; }
            let saved = JSON.parse(localStorage.getItem('savedLogos_' + type)) || [];
            if(!saved.includes(imgEl.src)) {
                saved.push(imgEl.src);
                if(saved.length > 5) saved.shift(); 
                localStorage.setItem('savedLogos_' + type, JSON.stringify(saved));
                renderSavedLogos(type);
            }
        }
        function renderSavedLogos(type) {
            let saved = JSON.parse(localStorage.getItem('savedLogos_' + type)) || [];
            let container = document.getElementById(type === 'top' ? 'saved-top-logos' : 'saved-stamp-logos');
            container.innerHTML = '';
            saved.forEach(src => {
                let img = document.createElement('img');
                img.src = src;
                img.onclick = () => { 
                    document.getElementById(type === 'top' ? 'out-logo-top' : 'out-logo-stamp').src = src; 
                    if(type==='stamp') { stampUploaded = true; rebuildNewsBody(); }
                };
                container.appendChild(img);
            });
        }
        function savePrefix() {
            let val = document.getElementById('in-news-prefix').value.trim();
            if(!val) return;
            let saved = JSON.parse(localStorage.getItem('savedPrefixes')) || [];
            if(!saved.includes(val)) {
                saved.push(val);
                localStorage.setItem('savedPrefixes', JSON.stringify(saved));
                renderPrefixes();
            }
        }
        function renderPrefixes() {
            let saved = JSON.parse(localStorage.getItem('savedPrefixes')) || [];
            let select = document.getElementById('saved-prefixes');
            select.innerHTML = '<option value="">-- Saved Prefixes Here --</option>';
            saved.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p; opt.innerText = p;
                select.appendChild(opt);
            });
        }
        
        function saveProjectData() {
            let data = {
                wrapW: document.getElementById('in-wrap-w').value,
                ovrCheck: document.getElementById('in-overall-box-check').checked,
                ovrColor: document.getElementById('in-overall-color').value,
                subHl: document.getElementById('in-sub-headline').value,
                subY: document.getElementById('in-sub-y').value,
                subLh: document.getElementById('in-sub-lh').value,
                mainHl: document.getElementById('in-main-headline').value,
                mainMode: document.getElementById('in-main-mode').value,
                mainStyle: document.getElementById('in-special-style').value,
                mainY: document.getElementById('in-main-y').value,
                mainLh: document.getElementById('in-main-lh').value,
                bullets: document.getElementById('in-bullets').value,
                newsBody: document.getElementById('in-news-body').value,
                bodyLh: document.getElementById('in-body-lh').value
            };
            localStorage.setItem('lastSavedProject', JSON.stringify(data));
            alert("Project saved successfully! Use 'Load' next time.");
        }
        
        function loadProjectData() {
            let dataStr = localStorage.getItem('lastSavedProject');
            if(!dataStr) { alert("No saved project found."); return; }
            let data = JSON.parse(dataStr);
            document.getElementById('in-wrap-w').value = data.wrapW;
            document.getElementById('in-overall-box-check').checked = data.ovrCheck;
            document.getElementById('in-overall-color').value = data.ovrColor;
            
            document.getElementById('in-sub-headline').value = data.subHl;
            document.getElementById('in-sub-y').value = data.subY;
            document.getElementById('in-sub-lh').value = data.subLh || 1.3;
            
            document.getElementById('in-main-headline').value = data.mainHl;
            document.getElementById('in-main-mode').value = data.mainMode;
            document.getElementById('in-special-style').value = data.mainStyle;
            document.getElementById('in-main-y').value = data.mainY;
            document.getElementById('in-main-lh').value = data.mainLh || 1.3;
            
            document.getElementById('in-bullets').value = data.bullets || '';
            document.getElementById('in-news-body').value = data.newsBody;
            document.getElementById('in-body-lh').value = data.bodyLh || 1.5;
            rawNewsText = data.newsBody;
            
            document.getElementById('in-wrap-w').dispatchEvent(new Event('input'));
            document.getElementById('in-sub-lh').dispatchEvent(new Event('input'));
            document.getElementById('in-main-lh').dispatchEvent(new Event('input'));
            document.getElementById('in-body-lh').dispatchEvent(new Event('input'));
            updateOverallBox();
            document.getElementById('in-main-mode').dispatchEvent(new Event('change'));
            updateBullets();
            rebuildNewsBody();
            alert("Last saved project loaded successfully!");
        }

        renderSavedLogos('top'); renderSavedLogos('stamp'); renderPrefixes();
        updateMainHeadlineBox(); // Clear out preview defaults

        function downloadClipping() {
          const btn = document.getElementById('main-download-btn');
          const originalText = btn.innerText;
          btn.innerText = "⏳ Processing.. (Please Wait)";
          btn.style.opacity = "0.7";
          
          requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.scrollTo(0, 0); 
                const element = document.getElementById('capture-area');
                const oldTransform = element.style.transform;
                element.style.transform = 'none'; 
                
                html2canvas(element, { 
                    scale: 3, 
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: "#ffffff", 
                    logging: false 
                }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'Ultra_HD_Clipping.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 1.0); 
                    link.click();
                    
                    element.style.transform = oldTransform;
                    btn.innerText = originalText;
                    btn.style.opacity = "1";
                }).catch(err => {
                    alert("Error during download.");
                    btn.innerText = originalText;
                    btn.style.opacity = "1";
                });
              });
          });
        }
    </script>
